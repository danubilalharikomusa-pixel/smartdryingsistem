<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Drying System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#07090f;
  --surface:#0d1117;
  --border:rgba(255,255,255,0.07);
  --purple:#a855f7;
  --cyan:#06b6d4;
  --green:#10b981;
  --yellow:#f59e0b;
  --red:#ef4444;
  --text:#f1f5f9;
  --muted:#64748b;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  background:var(--bg);
  background-image:radial-gradient(rgba(168,85,247,0.055) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--text);min-height:100vh;
}

/* ===== LOGIN ===== */
#loginOverlay{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
}
.login-box{
  width:100%;max-width:380px;
  background:rgba(13,17,23,0.95);
  border:1px solid rgba(168,85,247,.2);
  border-radius:20px;padding:36px 32px;margin:16px;
}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;}
.login-logo-icon{
  width:44px;height:44px;border-radius:12px;
  background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.login-logo-text{font-size:18px;font-weight:800;}
.login-logo-text span{color:var(--purple);}
.login-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:24px;}
.login-field{margin-bottom:14px;}
.login-field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;}
.login-input{
  width:100%;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:11px 14px;
  color:var(--text);font-size:14px;outline:none;
}
.login-input:focus{border-color:rgba(168,85,247,.5);}
.login-error{
  display:none;align-items:center;gap:7px;
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);
  border-radius:8px;padding:9px 12px;
  font-size:12px;color:#f87171;margin-bottom:14px;
}
.login-error.show{display:flex;}
.login-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;font-size:14px;font-weight:700;cursor:pointer;
}
.login-btn:hover{opacity:.9;}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}
.shake{animation:shake .35s ease;}
@keyframes fadeOut{to{opacity:0;pointer-events:none;}}
.fade-out{animation:fadeOut .4s ease forwards;}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:32px 28px;display:none;}
.main.visible{display:block;}
.page-header{margin-bottom:22px;}
.page-header h1{font-size:24px;font-weight:800;}

/* CONN BAR */
.conn-bar{
  display:flex;align-items:center;gap:10px;
  background:rgba(13,17,23,0.8);border:1px solid var(--border);
  border-radius:10px;padding:9px 14px;margin-bottom:20px;
  font-size:12px;font-weight:500;color:var(--muted);
}
.conn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.conn-dot.connected{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;}
.conn-dot.disconnected{background:var(--red);}
.conn-dot.connecting{background:var(--yellow);box-shadow:0 0 6px var(--yellow);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ESP32 */
.esp-chip{
  display:inline-flex;align-items:center;gap:13px;
  background:rgba(13,17,23,0.7);border:1px solid var(--border);
  border-radius:14px;padding:14px 18px;margin-bottom:20px;
}
.chip-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  background:rgba(6,182,212,.1);
}
.chip-text .lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;}
.chip-text .val{font-size:15px;font-weight:700;margin-top:2px;}
.chip-text .sub{font-size:10px;color:var(--muted);margin-top:1px;}

/* SENSOR GRID */
.sensor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
.sensor-card{
  background:rgba(13,17,23,0.8);border-radius:18px;
  padding:22px;border:1px solid var(--border);position:relative;overflow:hidden;
}
.sensor-card::before{
  content:'';position:absolute;
  top:-50px;right:-50px;width:140px;height:140px;
  border-radius:50%;
  background:var(--card-glow,rgba(168,85,247,.05));
  filter:blur(35px);pointer-events:none;
}
.s-icon-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.s-icon-box{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
}
.s-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
.s-value{font-size:48px;font-weight:800;line-height:1;margin-bottom:14px;letter-spacing:-2px;}
.s-value .unit{font-size:17px;font-weight:400;color:var(--muted);}
.s-badge{
  display:inline-flex;align-items:center;
  padding:4px 11px;border-radius:7px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  border:1px solid;
}
.badge-raw{background:rgba(168,85,247,.1);color:#a855f7;border-color:rgba(168,85,247,.2);}

/* SYSTEM GRID */
.system-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.system-card{
  background:rgba(13,17,23,0.8);border-radius:18px;
  padding:22px;border:1px solid var(--border);
}
.sc-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
}
.sc-header h3{font-size:11px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.8px;}

/* TOGGLE */
.mode-toggle{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;}
.mode-toggle span{color:var(--muted);}
.mode-toggle span.active-mode{color:var(--text);}
.toggle-switch{position:relative;width:38px;height:20px;cursor:pointer;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#1e293b;border-radius:20px;transition:.3s;}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;background:white;border-radius:50%;top:3px;left:3px;transition:.3s;}
.toggle-switch input:checked + .toggle-slider{background:#7c3aed;}
.toggle-switch input:checked + .toggle-slider::before{transform:translateX(18px);}

/* JEMURAN */
.jemuran-visual{display:flex;justify-content:center;margin:6px 0 14px;}
.jemuran-wrap{
  background:rgba(168,85,247,.03);border:1px solid rgba(168,85,247,.08);
  border-radius:14px;padding:10px;
}
.pos-badge{
  text-align:center;font-size:11px;font-weight:700;
  margin-bottom:10px;padding:4px 14px;border-radius:7px;
  display:inline-block;border:1px solid;
  color:#fbbf24;background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.25);
}
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;}
.info-row:last-child{border-bottom:none;}
.info-row .l{color:var(--muted);}
.info-row .v{color:var(--text);font-weight:600;}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px;}
.btn-masuk{
  padding:10px;border:none;border-radius:9px;
  background:linear-gradient(135deg,#991b1b,#ef4444);
  color:white;font-size:12px;font-weight:700;cursor:pointer;
}
.btn-keluar{
  padding:10px;border:none;border-radius:9px;
  background:linear-gradient(135deg,#065f46,#10b981);
  color:white;font-size:12px;font-weight:700;cursor:pointer;
}
.btn-masuk:hover,.btn-keluar:hover{transform:scale(1.03);}
.btn-masuk:disabled,.btn-keluar:disabled{opacity:.35;cursor:not-allowed;transform:none;}

/* FAN */
.fan-wrap{display:flex;flex-direction:column;align-items:center;padding:12px 0 16px;}
.fan-rings{position:relative;width:108px;height:108px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.fan-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(6,182,212,.18);}
.fan-ring.r1{width:108px;height:108px;}
.fan-ring.r2{width:78px;height:78px;}
.fan-ring.r3{width:52px;height:52px;border-color:rgba(6,182,212,.3);}
.fan-spinning .fan-ring.r1{animation:rpulse 2s ease-in-out infinite;}
.fan-spinning .fan-ring.r2{animation:rpulse 2s ease-in-out infinite .4s;}
.fan-spinning .fan-ring.r3{animation:rpulse 2s ease-in-out infinite .8s;}
@keyframes rpulse{0%,100%{opacity:.2;transform:scale(1);}50%{opacity:.7;transform:scale(1.05);}}
.fan-core{
  width:50px;height:50px;border-radius:50%;
  background:rgba(6,182,212,.07);border:1.5px solid rgba(6,182,212,.28);
  display:flex;align-items:center;justify-content:center;z-index:1;
}
.fan-core svg{width:26px;height:26px;color:#06b6d4;}
.fan-spinning .fan-core svg{animation:spin 1.2s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.fan-status{font-size:15px;font-weight:700;margin-bottom:3px;}
.fan-sub{font-size:11px;color:var(--muted);text-align:center;}
.btn-fan{
  width:100%;padding:10px;border:none;border-radius:9px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;font-size:12px;font-weight:700;cursor:pointer;margin-top:13px;
}
.btn-fan:hover{transform:scale(1.02);}
.btn-fan:disabled{opacity:.35;cursor:not-allowed;transform:none;}

/* LOG */
.log-card{
  background:rgba(13,17,23,0.8);border:1px solid var(--border);
  border-radius:18px;padding:22px;
}
.log-card h2{
  font-size:12px;font-weight:700;margin-bottom:14px;
  display:flex;align-items:center;gap:7px;
  text-transform:uppercase;letter-spacing:.5px;
}
.log-item{
  display:flex;gap:12px;
  background:rgba(255,255,255,.02);
  border-left:2px solid rgba(168,85,247,.35);
  padding:8px 12px;border-radius:0 8px 8px 0;
  margin-bottom:7px;font-size:11.5px;align-items:flex-start;
}
.log-item:last-child{margin-bottom:0;}
.log-time{color:var(--muted);font-size:10px;flex-shrink:0;margin-top:1px;white-space:nowrap;min-width:55px;}
.log-msg{flex:1;line-height:1.5;}

/* MOBILE */
@media(max-width:768px){
  .main{padding:16px;}
  .sensor-grid{grid-template-columns:1fr;}
  .system-grid{grid-template-columns:1fr;}
  .s-value{font-size:40px;}
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginOverlay">
  <div class="login-box" id="loginBox">
    <div class="login-logo">
      <div class="login-logo-icon">🌿</div>
      <div class="login-logo-text">Smart<span>Drying</span></div>
    </div>
    <div class="login-title">Selamat datang</div>
    <div class="login-sub">Masukkan password untuk mengakses dashboard</div>
    <div class="login-error" id="loginError">
      <span id="loginErrorMsg">Password salah. Coba lagi.</span>
    </div>
    <div class="login-field">
      <label>Password</label>
      <input class="login-input" type="password" id="pwInput" placeholder="Masukkan password..." onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Masuk ke Dashboard</button>
    <div class="login-sub" style="margin-top:20px;text-align:center;">
      Smart Drying System — IoT Dashboard
    </div>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div class="main" id="dashMain">
  <div class="page-header"><h1>Dashboard</h1></div>

  <!-- Connection Status -->
  <div class="conn-bar">
    <div class="conn-dot connecting" id="connDot"></div>
    <span id="connText">Menghubungkan ke MQTT...</span>
  </div>

  <!-- ESP32 Status -->
  <div class="esp-chip">
    <div class="chip-icon">⚡</div>
    <div class="chip-text">
      <div class="lbl">ESP32</div>
      <div class="val" id="esp32Val" style
